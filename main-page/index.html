<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네이버 웹툰</title>
    <link rel="stylesheet" href="../common.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" type="image/png" href="./images/Logotype/WEBTOON_Logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="js/main-page.js"></script>
</head>
<body>
    <header>
        <div class="Header_BrandBar">
            <h1 class="BrandBar_left">
                <a href="https://www.naver.com/">
                <img src="./images/Logotype/Logotype_Black.svg" alt="네이버">
                </a>
                <a href="https://comic.naver.com/index">
                    <span class="webtoon_page">웹툰</span>
                </a>
                <span class="BrandBar_bar">|</span>
                <a class="BrandBar_link" target="_blank" href="https://novel.naver.com/">
                    <span>웹소설</span>
                </a>
                <span class="BrandBar_bar">|</span>
                <a class="BrandBar_link" target="_blank" href="https://series.naver.com/comic/home.series">
                    <span>시리즈</span>
                </a>
            </h1>
            <div class="BrandBar_right">
                <div class="SearchBox">
                    <input placeholder="제목/작가로 검색할 수 있습니다.">
                    <button type="button"><i class="fa-brands fa-sistrix"></i></button>
                </div>
                <div class="Login_Service_btns">
                    <button type="button" class="NaverLogin_btn">로그인</button>
                    <button type="button" class="service_menu_btn">
                        <i class="fa-solid fa-grip"></i>
                    </button>
                </div>
            </div>
        </div>
        <hr>
        <nav class="Header_NaviBar" >
            <ul>
                <li class="navi_home">
                    <a href="https://comic.naver.com/index">홈</a>
                </li>
                <li>
                    <a href="https://comic.naver.com/webtoon">웹툰</a>
                </li>
                <li>
                    <a target="_blank" href="https://comic.naver.com/cuts/v">컷츠</a>
                </li>
                <li>
                    <a href="https://comic.naver.com/bestChallenge">베스트도전</a>
                </li>
                <li>
                    <a href="https://comic.naver.com/challenge">도전만화</a>
                </li>
                <li>
                    <a href="https://nid.naver.com/nidlogin.login?mode=form&url=https%3A%2F%2Fcomic.naver.com%2Fmypage%2Ffavorite">마이페이지</a>
                </li>
            </ul>
            <button type="button" class="Creators_btn">CREATOR'S</button>
        </nav>
        <hr>
    </header>
    <main class="container">
        <div class="HomeView_Daily">
            <div class="Daily_Head">
                <h2>화요웹툰</h2>
                <div class="filters">
                    <button type="button" class="on">인기순</button>
                    <button type="button">업데이트순</button>
                    <button type="button">조회순</button>
                    <button type="button">별점순</button>
                </div>
            </div>
            <a href="https://comic.naver.com/webtoon?tab=tue" >
                <span>화요웹툰 전체보기</span>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
        </div>
        <ul class="DailyList">
            <li>
                <div class="HomeView_Poster">
                    <img src="./images/webtoon_poster_mockup/01_별빛_우체국.png" alt="별빛 우체국 포스터">
                </div>
                <div class="Daily_info">
                    <div class="Daily_title">
                        <span class="updated_badge">up</span>
                        <span>별빛 우체국</span>
                    </div>
                    <a href="작가페이지">작가명1</a>
                </div>
            </li>
            <li>
                <div class="HomeView_Poster">
                    <img src="./images/webtoon_poster_mockup/02_월요일의_고백.png" alt="월요일의 고백 포스터">
                </div>
                <div class="Daily_info">
                    <div class="Daily_title">
                        <span class="updated_badge">up</span>
                        <span>월요일의 고백</span>
                    </div>
                    <a href="작가페이지">작가명2</a>
                </div>
            </li>
            <li>
                <div class="HomeView_Poster">
                    <img src="./images/webtoon_poster_mockup/03_검은_달의_기사.png" alt="검은 달의 기사 포스터">
                </div>
                <div class="Daily_info">
                    <div class="Daily_title">
                        <span class="updated_badge">up</span>
                        <span>검은 달의 기사</span>
                    </div>
                    <a href="작가페이지">작가명3</a>
                </div>
            </li>
            <li>
                <div class="HomeView_Poster">
                    <img src="./images/webtoon_poster_mockup/04_고양이_사장님.png" alt="고양이 사장님 포스터">
                </div>
                <div class="Daily_info">
                    <div class="Daily_title">
                        <span class="updated_badge">up</span>
                        <span>고양이 사장님</span>
                    </div>
                    <a href="작가페이지">작가명4</a>
                </div>
            </li>
            <li>
                <div class="HomeView_Poster">
                    <img src="./images/webtoon_poster_mockup/05_마지막_열차.png" alt="마지막 열차 포스터">
                </div>
                <div class="Daily_info">
                    <div class="Daily_title">
                        <span class="updated_badge">up</span>
                        <span>마지막 열차</span>
                    </div>
                    <a href="작가페이지">작가명5</a>
                </div>
            </li>
        </ul>
        <button type="button" class="DailyList_nxt_btn">
            <i class="fa-thin fa-chevron-right"></i>
        </button>
    </main>
</body>
</html>


<!-- 속성 순서는 배치 → 크기·여백 → 글자 → 색상·테두리로 맞췄습니다. 이 순서 자체가 동작을 바꾸지는 않지만, 찾고 수정하기 쉬워집니다.
두 가지는 따로 기억하세요.
- 폰트: 현재 등록한 굵기는 400·600·700입니다. 100·300·900을 지정해도 해당 파일이 없으면 브라우저가 다른 굵기를 대신 사용하거나 합성할 수 있습니다. 정확한 굵기가 필요하면 파일을 추가하세요.
- 반응형: 현재 1190px 고정 너비는 데스크톱 재현 단계입니다. 헤더가 완성되면 좁은 화면 대응을 추가해야 합니다.
지금 확인할 것은 브랜드바 63px, 내비게이션 55px, 검색 아이콘의 오른쪽 정렬, 전체 폭 구분선입니다. -->
